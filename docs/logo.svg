<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-labelledby="title">
  <title id="title">Engram logo: a memory graph shaped like an E</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4338CA"/>
      <stop offset="1" stop-color="#9333EA"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <!-- faint associative links: memories connect across layers -->
  <g stroke="#C4B5FD" stroke-opacity="0.45" stroke-width="2.5" stroke-linecap="round" fill="none">
    <path d="M88 36 L74 64 L88 92"/>
    <path d="M40 36 L74 64 L40 92"/>
  </g>
  <!-- the E: a spine with three branches -->
  <g stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" fill="none">
    <path d="M40 36 V92"/>
    <path d="M40 36 H88"/>
    <path d="M40 64 H74"/>
    <path d="M40 92 H88"/>
  </g>
  <circle cx="74" cy="64" r="16" fill="url(#glow)" opacity="0.55"/>
  <g fill="#FFFFFF">
    <circle cx="40" cy="36" r="8"/>
    <circle cx="88" cy="36" r="7"/>
    <circle cx="40" cy="64" r="8"/>
    <circle cx="74" cy="64" r="9"/>
    <circle cx="40" cy="92" r="8"/>
    <circle cx="88" cy="92" r="7"/>
  </g>
  <circle cx="74" cy="64" r="4" fill="#7C3AED"/>
</svg>
