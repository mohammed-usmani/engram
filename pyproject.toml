[project]
name = "engram"
version = "0.1.0"
description = "One shared, self-organising memory for all your AI assistants (MCP + REST)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.129.0",
    "jinja2>=3.1.4",
    "mcp>=1.2.0",
    "psycopg[binary]>=3.3.2",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.2.1",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0.46",
    "uvicorn>=0.40.0",
    "pgvector>=0.3.0",
    "ollama>=0.4.0",
    "numpy>=1.26.0",
    "openai>=1.40.0",
    "google-genai>=1.0.0",
    "anthropic>=0.40.0",
    "greenlet>=3.3.1",
    "mem0ai>=2.2.1",
    "psycopg-pool>=3.3.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "black>=26.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.black]
line-length = 100
