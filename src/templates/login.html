{% extends "base.html" %}
{% set bare = true %}
{% block title %}Sign in · Engram{% endblock %}
{% block bare %}
<main style="max-width:400px;margin:12vh auto;padding:0 16px" class="stack">
  <div class="brand" style="padding:0"><span class="brand-mark">e</span><span class="brand-name">Engram</span></div>
  <h1 style="font-size:32px">Sign in</h1>
  <p class="muted">Enter your Engram admin token to open the admin panel in this browser.</p>
  {% if error %}<div class="callout bad" role="alert">{{ error }}</div>{% endif %}
  <form method="post" action="/login" class="stack">
    <input type="hidden" name="next" value="{{ next }}">
    <label class="field"><span class="label">Admin token</span>
      <input class="input" type="password" name="admin_token" autofocus required autocomplete="current-password"></label>
    <button type="submit" class="btn primary">Sign in</button>
  </form>
</main>
{% endblock %}
