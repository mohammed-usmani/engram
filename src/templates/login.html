{% extends "base.html" %}
{% block title %}Sign in · Engram{% endblock %}
{% block body %}
<div style="max-width:380px;margin:12vh auto;padding:0 16px">
  <h1 style="font-family:var(--font-heading);margin-bottom:.5rem">Sign in</h1>
  <p style="color:var(--text-muted);margin-bottom:1.5rem">Enter your Engram admin token to open the admin panel from this browser.</p>
  {% if error %}<p style="color:#b00;margin-bottom:1rem">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="next" value="{{ next }}">
    <input type="password" name="admin_token" placeholder="Admin token" autofocus required
           style="width:100%;padding:.7rem;border:1px solid var(--border);border-radius:var(--radius);font:inherit">
    <button type="submit" style="width:100%;margin-top:.8rem;padding:.7rem;border:2px solid var(--border-strong);background:var(--text);color:var(--bg);border-radius:var(--radius);font:inherit;cursor:pointer">Sign in</button>
  </form>
</div>
{% endblock %}
